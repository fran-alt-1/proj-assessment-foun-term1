<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Three cybersecurity career roles</title><desc id="desc">Illustrated role cards for a security operations analyst, cybersecurity technician and incident response analyst.</desc><rect width="760" height="400" rx="28" fill="#f2f8fa"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="28" y="43" width="220" height="292" rx="20" fill="#fff" stroke="#d6e6eb" stroke-width="2"/><circle cx="138" cy="125" r="48" fill="#e5f5f3"/><rect x="108" y="104" width="60" height="42" rx="5" fill="none" stroke="#087f8c" stroke-width="4"/><path d="M119 157h38m-19-11v11m-17-33h9m8 0h8m8 0h3" stroke="#087f8c" stroke-width="4" stroke-linecap="round"/><text x="138" y="220" fill="#102a43" font-size="17" font-weight="700">SOC ANALYST</text><text x="138" y="251" fill="#526579" font-size="14">Reviews alerts and</text><text x="138" y="273" fill="#526579" font-size="14">investigates activity</text></g><g><rect x="270" y="43" width="220" height="292" rx="20" fill="#fff" stroke="#d6e6eb" stroke-width="2"/><circle cx="380" cy="125" r="48" fill="#fff0d8"/><path d="M380 91 412 103v26c0 22-13 37-32 49-19-12-32-27-32-49v-26z" fill="none" stroke="#c47d16" stroke-width="4"/><path d="m365 128 11 11 21-25" fill="none" stroke="#c47d16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="220" fill="#102a43" font-size="17" font-weight="700">CYBER TECHNICIAN</text><text x="380" y="251" fill="#526579" font-size="14">Maintains protective</text><text x="380" y="273" fill="#526579" font-size="14">tools and devices</text></g><g><rect x="512" y="43" width="220" height="292" rx="20" fill="#fff" stroke="#d6e6eb" stroke-width="2"/><circle cx="622" cy="125" r="48" fill="#e8eafb"/><path d="M600 131a24 24 0 1 1 8 17m-9-25v16h16" fill="none" stroke="#5967a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M621 100v18l13 8" fill="none" stroke="#5967a8" stroke-width="4" stroke-linecap="round"/><text x="622" y="220" fill="#102a43" font-size="16" font-weight="700">INCIDENT RESPONSE</text><text x="622" y="251" fill="#526579" font-size="14">Helps contain issues</text><text x="622" y="273" fill="#526579" font-size="14">and restore services</text></g><text x="380" y="375" fill="#526579" font-size="14">Communication, curiosity and ethical practice matter in every role.</text></g></svg>
