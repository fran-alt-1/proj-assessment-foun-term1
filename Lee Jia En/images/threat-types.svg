dth="3"/><text x="258" y="323" fill="#102a43" font-size="17" font-weight="700">SOCIAL ENGINEERING</text></g><g><rect x="392" y="210" width="220" height="145" rx="18" fill="#fff" stroke="#d7e7ec" stroke-width="2"/><circle cx="502" cy="261" r="31" fill="#e2f5f2"/><path d="M480 248h44v29h-44z" fill="none" stroke="#087f8c" stroke-width="3"/><path d="m480 250 22 16 22-16m-34 39 12-11 12 11" fill="none" stroke="#087f8c" stroke-width="3" stroke-linejoin="round"/><text x="502" y="323" fill="#102a43" font-size="17" font-weight="700">DATA THEFT</text></g><text x="380" y="388" fill="#526579" font-size="14">A threat can use technology, deception, or both.</text></g></svg>
