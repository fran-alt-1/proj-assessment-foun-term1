<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="title desc"><title id="title">Four steps after a suspicious click</title><desc id="desc">A simple flow from stop, to report, protect and recover.</desc><rect width="700" height="390" rx="28" fill="#f1f8fa"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="30" y="105" width="140" height="180" rx="20" fill="#fff" stroke="#d5e6ec" stroke-width="3"/><circle cx="100" cy="157" r="31" fill="#fff0d8"/><path d="M100 137v22m0 12v2" stroke="#bd7a14" stroke-width="6" stroke-linecap="round"/><text x="100" y="225" fill="#102a43" font-size="22" font-weight="700">STOP</text><text x="100" y="251" fill="#526579" font-size="13">Don't enter more</text></g><path d="M175 195h28m-9-9 9 9-9 9" fill="none" stroke="#087f8c" stroke-width="4"/><g><rect x="205" y="105" width="140" height="180" rx="20" fill="#fff" stroke="#d5e6ec" stroke-width="3"/><circle cx="275" cy="157" r="31" fill="#dff5f2"/><path d="M258 146h34v23h-34zm0 0 17 13 17-13" fill="none" stroke="#087f8c" stroke-width="3"/><text x="275" y="225" fill="#102a43" font-size="22" font-weight="700">REPORT</text><text x="275" y="251" fill="#526579" font-size="13">Use official channel</text></g><path d="M350 195h28m-9-9 9 9-9 9" fill="none" stroke="#087f8c" stroke-width="4"/><g><rect x="380" y="105" width="140" height="180" rx="20" fill="#fff" stroke="#d5e6ec" stroke-width="3"/><circle cx="450" cy="157" r="31" fill="#e7e9fb"/><path d="M450 137 469 145v16c0 12-7 22-19 29-12-7-19-17-19-29v-16z" fill="none" stroke="#5967a8" stroke-width="3"/><text x="450" y="225" fill="#102a43" font-size="22" font-weight="700">PROTECT</text><text x="450" y="251" fill="#526579" font-size="13">Follow IT guidance</text></g><path d="M525 195h28m-9-9 9 9-9 9" fill="none" stroke="#087f8c" stroke-width="4"/><g><rect x="555" y="105" width="115" height="180" rx="20" fill="#fff" stroke="#d5e6ec" stroke-width="3"/><circle cx="612" cy="157" r="31" fill="#e2f4e9"/><path d="M596 160a17 17 0 1 1 6 12m-7-18v9h9" fill="none" stroke="#458b62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="612" y="225" fill="#102a43" font-size="20" font-weight="700">RECOVER</text><text x="612" y="251" fill="#526579" font-size="12">Restore and learn</text></g><text x="350" y="67" fill="#087f8c" font-size="15" font-weight="700" letter-spacing="2">A SIMPLE RESPONSE PATH</text></g></svg>
