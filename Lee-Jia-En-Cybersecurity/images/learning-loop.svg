<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">A lifelong cybersecurity learning cycle</title><desc id="desc">Four steps form a repeating cycle: learn an idea, practise safely, reflect on results and check trusted sources.</desc><rect width="760" height="390" rx="28" fill="#f2f8fa"/><g fill="none" stroke="#a6d5d0" stroke-width="6" stroke-linecap="round"><path d="M231 113h286"/><path d="m504 101 15 12-15 12"/><path d="M545 144v120"/><path d="m533 251 12 15 12-15"/><path d="M514 293H238"/><path d="m250 281-15 12 15 12"/><path d="M211 262V143"/><path d="m199 155 12-15 12 15"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="210" cy="110" r="55" fill="#fff" stroke="#087f8c" stroke-width="4"/><path d="M191 111h38m-30-11h22m-22 22h28" stroke="#087f8c" stroke-width="4" stroke-linecap="round"/><text x="210" y="184" fill="#102a43" font-size="17" font-weight="700">LEARN AN IDEA</text></g><g><circle cx="550" cy="110" r="55" fill="#fff" stroke="#087f8c" stroke-width="4"/><path d="M528 92h44v34h-44z" fill="#dff5f2" stroke="#087f8c" stroke-width="3"/><path d="M537 103h26m-26 10h18" stroke="#087f8c" stroke-width="3"/><text x="550" y="184" fill="#102a43" font-size="17" font-weight="700">PRACTISE SAFELY</text></g><g><circle cx="550" cy="278" r="55" fill="#fff" stroke="#087f8c" stroke-width="4"/><path d="M530 279a20 20 0 1 1 7 15m-7-20v13h13" fill="none" stroke="#087f8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="352" fill="#102a43" font-size="17" font-weight="700">REFLECT</text></g><g><circle cx="210" cy="278" r="55" fill="#fff" stroke="#087f8c" stroke-width="4"/><path d="M187 268h46v28h-46z" fill="none" stroke="#087f8c" stroke-width="3"/><path d="m188 270 22 16 22-16" fill="none" stroke="#087f8c" stroke-width="3"/><text x="210" y="352" fill="#102a43" font-size="17" font-weight="700">CHECK TRUSTED SOURCES</text></g></g></svg>
